<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的新手名片</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; max-width: 300px; }
        h1 { color: #333; }
        p { color: #666; margin: 10px 0; }
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 8px; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h1>你好！我是 [写你的名字]</h1>
        <p>🚀 正在学习 GitHub</p>
        <p>📧 我的邮箱: your-email@example.com</p>
        <a href="https://github.com" class="btn">去逛逛 GitHub</a>
    </div>
</body>
</html>
