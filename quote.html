<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日励志语录</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-width: 500px; text-align: center; width: 90%; }
        h1 { color: #333; font-size: 24px; margin-bottom: 20px; }
        #quote { font-size: 22px; color: #444; margin: 20px 0; min-height: 100px; display: flex; align-items: center; justify-content: center; font-style: italic; }
        button { background: #764ba2; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #5a3d7a; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ 今日一句 ✨</h1>
        <div id="quote">点击按钮，获取一段励志的话</div>
        <button onclick="showQuote()">换一句</button>
    </div>

    <script>
        const quotes = [
            "行动是治愈恐惧的良药。",
            "千里之行，始于足下。",
            "种一棵树最好的时间是十年前，其次是现在。",
            "把每一天都当作新开始。",
            "不要等待机会，而要创造机会。"
        ];

        function showQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById('quote').textContent = quotes[randomIndex];
        }
    </script>
</body>
</html>
